<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#161828" />
  <title>Камера — Новгородские Вести</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Версии зафиксированы, чтобы обновление CDN внезапно не изменило прототип. -->
  <script crossorigin="anonymous" src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body class="camera-stage">
  <canvas id="effectsCanvas" width="512" height="724" hidden></canvas>

  <a-scene id="arScene"
           mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; warmupTolerance: 3; missTolerance: 2; uiLoading: no; uiScanning: no; uiError: no"
           embedded
           renderer="alpha: true; colorManagement: true"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
    <a-entity id="coverTarget" mindar-image-target="targetIndex: 0">
      <!-- Размер газеты: 1055 × 1491, поэтому height = 1491 / 1055. -->
      <!-- Полупрозрачные эффекты закреплены на плоскости самой обложки. -->
      <a-plane id="snowLayer"
               position="0 0 0" visible="false"
               width="1" height="1.41327"
               material="shader: flat; src: #effectsCanvas; transparent: true; opacity: 1; side: double; depthWrite: false">
      </a-plane>
      <!-- Позднее сюда можно добавить a-video поверх нужной области обложки. -->
    </a-entity>
  </a-scene>

</body>
</html>
