<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#161828" />
  <title>Оживи обложку — Новгородские Вести / WebAR MVP</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <main id="intro" class="intro">
    <div class="panel">
      <div class="eyebrow">Новгородские Вести · WebAR</div>
      <h1>Газета оживает</h1>
      <p>Наведите камеру телефона на распечатанную обложку или её изображение на другом экране. Появятся снег и мерцание огней, привязанные к газете.</p>
      <img class="cover-preview" src="assets/cover.jpg?v=3" alt="Тестовая обложка газеты Новгородские Вести" />
      <button type="button" id="startButton" class="primary">Включить камеру</button>
      <p class="note">Понадобится обложка на бумаге или на другом экране.</p>
    </div>
  </main>

  <section id="cameraStage" aria-label="Камера дополненной реальности" hidden>
    <video id="camera" autoplay playsinline muted disablepictureinpicture disableremoteplayback aria-label="Изображение с камеры"></video>
    <canvas id="effectsCanvas" width="512" height="724" aria-hidden="true" hidden></canvas>
    <div class="hud">
      <div class="status" role="status"><span aria-label="Дополненная реальность">AR</span><span id="status"></span></div>
      <button type="button" id="stopButton" class="secondary">Закрыть</button>
      <div class="hint">
        <p id="detail" aria-live="polite"></p>
        <button type="button" id="retryButton" class="secondary" hidden></button>
      </div>
    </div>
  </section>
  <script src="effects.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
